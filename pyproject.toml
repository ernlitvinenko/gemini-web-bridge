[project]
name = "gemini-web-bridge"
version = "0.1.0"
description = "OpenAI-compatible API bridge to the Gemini web interface"
readme = "README.md"
authors = [
    { name = "Ernest Litvinenko", email = "ernest@elitvinenko.tech" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "playwright>=1.49,<2",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
gemini-web-bridge = "gemini_web_bridge:main"
gemini-web-bridge-login = "gemini_web_bridge.login:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pre-commit>=4.7.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.3",
]
